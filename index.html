<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title> Samah Ibrahim Ismail - Profile </title>

</head>


<body>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');

        :root {
            --bg-start: #e8f1ff;
            --bg-end: #ffffff;
            --text: #0b1230;
            --surface: #ffffffcc;
            --border: #0b123033;
            --accent: #0b7285;
            --accent-text: #ffffff;
        }

        body.dark {
            --bg-start: #050c25;
            --bg-end: #000000;
            --text: #ffffff;
            --surface: #ffffff0f;
            --border: #ffffff40;
            --accent: #ffffff;
            --accent-text: #050c25;
        }

        * {
            box-sizing: border-box;
            font-family: 'Ubuntu', sans-serif;
            padding: 0;
            margin: 0;
        }

        a {
            color: var(--text);
            text-decoration: none;
        }

        body {
            min-height: 100vh;
            background-image: linear-gradient(to right, var(--bg-start), var(--bg-end));
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 20px;
        }

        header {
            padding: 10px;
        }

        .logo {
            font-size: 40px;
            text-transform: uppercase;
            text-align: center;
            padding: 10px 0;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .bar-name {
            font-size: 20px;
            text-transform: uppercase;
        }

        ul {
            width: 50%;
            list-style: none;
            display: flex;
            justify-content: space-evenly;
        }

            ul a {
                border-bottom: 2px solid transparent;
            }

                ul a:hover {
                    border-bottom-color: var(--text);
                }

        main {
            padding: 30px 0;
        }

        .photo {
            display: block;
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent);
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            padding: 20px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

            .card:hover {
                border-color: var(--accent);
            }

            .card h2 {
                font-size: 24px;
                text-transform: uppercase;
                padding-bottom: 10px;
            }

            .card p {
                letter-spacing: 1px;
            }

        .contact {
            margin-top: 40px;
        }

            .contact h2 {
                font-size: 30px;
                text-transform: uppercase;
                padding-bottom: 10px;
            }

        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }

        label {
            padding: 10px 0 4px;
        }

        input {
            padding: 8px 10px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
        }

        button {
            font-size: 24px;
            margin-top: 30px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 2px solid transparent;
            background-color: var(--accent);
            color: var(--accent-text);
            cursor: pointer;
        }

            button:hover {
                background-color: transparent;
                border-color: var(--text);
                color: var(--text);
            }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .cards {
                flex-direction: column;
            }

            ul {
                width: 70%;
            }
        }
    </style>

    <div class="container">

        <header>

            <h1 class="logo"> Samah Ibrahim Ismail </h1>

            <nav class="bar">
                <span class="bar-name"> Samah Ibrahim Ismail </span>
                <ul>

                    <li>
                        <a href="#about"> about </a>
                    </li>

                    <li>
                        <a href="#contact"> contact </a>
                    </li>

                    <li>
                        <a href="https://github.com/YOUR-USERNAME"> github </a>
                    </li>

                </ul>
            </nav>

        </header>

        <main>

            <section id="about">

              <img src="images/me.jpg" alt="Portrait photo of Samah Ibrahim Ismail" class="photo" />

                <div class="cards">

                    <div class="card">
                        <h2> skills </h2>
                        <p> HTML, CSS and a little JavaScript </p>
                    </div>

                    <div class="card">
                        <h2> hobbies </h2>
                        <p> Reading, drawing and photography </p>
                    </div>

                    <div class="card">
                        <h2> goal </h2>
                        <p> To become a good web developer </p>
                    </div>

                </div>

            </section>

            <section id="contact" class="contact">

                <h2> leave your details </h2>

                <form>
                    <label for="name"> Name </label>
                    <input type="text" id="name" name="name" />

                    <label for="email"> Email </label>
                    <input type="email" id="email" name="email" />
                </form>

                <button id="theme-btn" type="button"> Dark / Light </button>

            </section>

        </main>

        <footer>
            <p> &copy; 2026 Samah Ibrahim Ismail. All rights reserved. </p>
        </footer>

    </div>

    <script>

        // Find the button by its id
        const themeButton = document.getElementById("theme-btn");

        // When it is clicked, add or remove the class "dark" on body
        themeButton.addEventListener("click", function () {
          document.body.classList.toggle("dark");
        });

    </script>

</body>






</html>
